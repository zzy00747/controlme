# 项目级 Gradle 配置(本地构建用)。CI 走 .github/ci-gradle.properties 隔离。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# JVM 目标对齐 JDK 21(与 CI 一致);Code 层面使用 bytecode 17 保持兼容面宽。
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本机默认走国内镜像;CI 在 .github/ci-gradle.properties 覆盖为 false。
controlme.useMirror=true